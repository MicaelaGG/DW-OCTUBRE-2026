<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Micaela García García</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/main.css'>
    <script src='js/main.js' defer></script>
</head>

<body>

    <!--Formulario de contacto-->
    <form method="POST" action="url/ejemplo" encytpe="multipart/form-data">

        <label for="nombre">NOMBRE:</label>
        <input type="text" id="nombre" name="nombre">

        <label for="email">EMAIL:</label>
        <input type="email" id="email" name="email">

        <label for="telefono">TELÉFONO:</label>
        <input type="number" id="telefono" name="telefono">

        <label for="nombre">COMENTARIO:</label>
        <textarea name="comentario"></textarea>

        <button type="enviar">ENVIAR</button>

    </form>

    <!--Formulario de registro de usuario-->
    <form method="POST" action="url/ejemplo" encytpe="multipart/form-data">

        <label for="nombre">NOMBRE:</label>
        <input type="text" id="nombre" name="nombre">

        <label for="nombre-de-usuario">NOMBRE DE USUARIO:</label>
        <input type="text" id="nombre-de-usuario" name="nombre-de-usuario">

        <label for="email">EMAIL:</label>
        <input type="email" id="email" name="email">

        <label for="repetir-email">REPETIR EMAIL:</label>
        <input type="email" id="repetir-email" name="repetir-email">

        <label for="fecha-de-nacimiento">FECHA DE NACIMIENTO:</label>
        <input type="date" id="fecha-de-nacimiento" name="fecha-de-nacimiento">

        <button type="enviar">ENVIAR</button>

    </form>

    <!--Formulario de login-->
    <form method="POST" action="url/ejemplo" encytpe="multipart/form-data">

        <label for="nombre-de-usuario">NOMBRE DE USUARIO:</label>
        <input type="text" id="nombre-de-usuario" name="nombre-de-usuario">

        <label for="contraseña">CONTRASEÑA:</label>
        <input type="password" id="contraseña" name="contraseña">

        <button type="enviar">ENVIAR</button>

    </form>

</body>

</html>
